name: docker build & push
run-name: docker build & push

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check buildx
        shell: bash
        run: |
          echo "========= Checking DriverStatus ========="
          docker info -f '{{.DriverStatus}}'

          echo "========= List all buildx ========="
          docker buildx ls

          echo "========= Inspect buildx ========="
          docker buildx inspect --bootstrap


      - name: Build image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=min
          tags: localimage:latest
          outputs: type=oci,dest=/tmp/localimage.tar

      - name: Check localimage.tar
        shell: bash
        run: |
          echo "========= Check artifact ========="
          ls -la /tmp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: /tmp/localimage.tar

  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set Env variables
        shell: bash
        run: |
          echo "========= Set variables ========="
          echo "BUILD_TIME=$(date -u '+%Y%m%d%H%M%S')" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Check localimage.tar
        shell: bash
        run: |
          echo "========= Check download artifact ========="
          ls -la

      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker load and push
        shell: bash
        run: |
          echo "========= Load image ========="
          docker load < localimage.tar

          echo "========= List image ========="
          docker image ls

          echo "========= Push image ========="
          IMAGE_FULL_NAME=${{ vars.DOCKERHUB_USERNAME }}/multi-arch-app:${{ env.BUILD_TIME }}-${{ env.SHORT_SHA }}
          echo "IMAGE_FULL_NAME=$IMAGE_FULL_NAME"
          docker tag localimage:latest $IMAGE_FULL_NAME
          docker push $IMAGE_FULL_NAME
